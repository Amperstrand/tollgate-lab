# omarchy-ux-real — the S5 shape (docs/SCENARIO-LAYER.md §3).
# Omarchy VM paying a real gateway on the lab's toll segment.
client:
  driver: omarchy_ux
  vssh: "ssh -p 2222 -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 -o IdentitiesOnly=yes omarchy@127.0.0.1"
  templates: vm-testbed/host/templates
payment:
  actor: ux_button
  template: btn-pay-tollgate.png
  sats: 21
gateway:
  driver: http_module
  base: "http://10.99.97.2:2121"
  token_source: fakewallet
capture:
  driver: wf_recorder
  split_screen: true
phases:
  renewal: true
  drain_and_fallback: true
  wallet_fresh: funded
